  function btn(text,cls,fn){const b=document.createElement('button');b.type='button';b.className='psu-dialog-v544-btn'+(cls?' '+cls:'');b.textContent=text;b.onclick=fn;return b}
  function next(){if(active||!q.length)return;ensure();active=q.shift();titleEl.textContent=active.title||({alert:'알림',confirm:'확인',prompt:'입력'}[active.kind]||'알림');bodyEl.innerHTML='';actionsEl.innerHTML='';const msg=document.createElement('div');msg.textContent=cleanMessage(active.message);bodyEl.appendChild(msg);let input=null;if(active.kind==='prompt'){input=document.createElement('input');input.className='psu-dialog-v544-input';input.type='text';input.value=String(active.defaultValue==null?'':active.defaultValue);bodyEl.appendChild(input);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(input.value)}})}if(active.kind==='alert'){actionsEl.appendChild(btn('확인','primary',()=>finish(true)))}else if(active.kind==='confirm'){actionsEl.appendChild(btn('취소','',()=>finish(false)));actionsEl.appendChild(btn('확인','primary',()=>finish(true)))}else{actionsEl.appendChild(btn('취소','',()=>finish(null)));actionsEl.appendChild(btn('확인','primary',()=>finish(input?input.value:'')))}back.classList.add('show');setTimeout(()=>{if(input){input.focus();input.select()}else{const b=actionsEl.querySelector('.primary');if(b)b.focus()}},20)}
  function finish(value){if(!active)return;const cur=active;active=null;if(back)back.classList.remove('show');if(cur.resolve)cur.resolve(value);setTimeout(next,0)}
  function push(item){q.push(item);next()}
  window.psuAlert=function(message,title){push({kind:'alert',message,title});};
  window.psuConfirm=function(message,title){return new Promise(resolve=>push({kind:'confirm',message,title,resolve}))};
  window.psuPrompt=function(message,defaultValue,title){return new Promise(resolve=>push({kind:'prompt',message,defaultValue,title,resolve}))};
})();
</script>
