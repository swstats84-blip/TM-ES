<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>PSU 작업현황</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f7fb; }
    #app {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #f5f7fb;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #334155;
      font: 600 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      z-index: 10;
      transition: opacity .18s ease;
      pointer-events: none;
    }
    #loading.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="loading">PSU 작업현황 불러오는 중...</div>
  <iframe
    id="app"
    title="PSU 작업현황"
    src="https://script.google.com/macros/s/AKfycbz77XFEuudXc_QKWTGKn28R1kI768AJHOjC2sHPXClri0nzM8Kf1kJSPNtugKvoXGGvsg/exec?v=113"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    app.addEventListener('load', () => {
      loading.classList.add('hide');
      setTimeout(() => loading.remove(), 250);
    }, { once: true });
  </script>
</body>
</html>
