<script id="web-v298-early-cache-prefetch-script">
(function(){
  if(window.__psuFastSnapshotPrefetchV298)return;
  window.__psuFastSnapshotPrefetchV298=(async()=>{
    try{
      if(!window.indexedDB)return null;
      const db=await new Promise((resolve,reject)=>{
        const r=indexedDB.open('psu_web_fast_snapshot',1);
        r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};
        r.onsuccess=()=>resolve(r.result);
        r.onerror=()=>reject(r.error||new Error('snapshot prefetch open failed'));
      });
      return await new Promise(resolve=>{
        const tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get('latest-v1');
        r.onsuccess=()=>resolve(r.result||null);
        r.onerror=()=>resolve(null);
        tx.oncomplete=()=>{try{db.close()}catch(_e){}};
        tx.onabort=()=>{try{db.close()}catch(_e){}};
      });
    }catch(_e){return null}
  })();
})();
</script>

<script id="psu-dialog-v544-script">

  function cleanMessage(v){

  }

    back.innerHTML='<div class="psu-dialog-v544-box" role="dialog" aria-modal="true"><div class="psu-dialog-v544-head"><div class="psu-dialog-v544-title"></div><button type="button" class="psu-dialog-v544-close" aria-label="닫기">×</button></div><div class="psu-dialog-v544-body"></div><div class="psu-dialog-v544-actions"></div></div>';

    back.addEventListener('mousedown',e=>{if(e.target===back&&active&&active.kind!=='alert')finish(active.kind==='prompt'?null:false)});
    closeEl.onclick=()=>finish(active&&active.kind==='prompt'?null:active&&active.kind==='confirm'?false:true);

  }
